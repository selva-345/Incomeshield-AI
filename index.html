// ══════════════════════════════════════════════════════════
// POLICY CENTER — AI-DRIVEN DYNAMIC PREMIUM SYSTEM
// ══════════════════════════════════════════════════════════
const PolicyCenter = ({ user, setPage }) => {
  const [policies, setPolicies] = useState([...DB.policies]);
  const [sel, setSel] = useState(() => user ? DB.policies.find(p=>p.userId===user.id) : DB.policies[0] || null);

  // Live env state for selected policy's city
  const [liveEnv, setLiveEnv] = useState(null);
  const [activeTrigger, setActiveTrigger] = useState(null); // null | 'RAIN'|'AQI'|'TRAFFIC'|'HEAT'
  const [prevPremium, setPrevPremium] = useState(null);
  const [premiumGlow, setPremiumGlow] = useState(null); // 'up'|'down'|null
  const [aiInsight, setAiInsight] = useState('');
  const [lastUpdated, setLastUpdated] = useState(null);
  const [showTooltip, setShowTooltip] = useState(false);

  // When selected policy changes, reset env
  useEffect(() => {
    if (sel) {
      const env = getEnvReadings(sel.city, null);
      setLiveEnv(env);
      setActiveTrigger(null);
      setPrevPremium(null);
      setPremiumGlow(null);
      setAiInsight('');
    }
  }, [sel?.id]);

  useEffect(() => subscribe(() => {
    const ps = [...DB.policies];
    setPolicies(ps);
    setSel(prev => prev ? ps.find(p=>p.id===prev.id)||ps[0] : ps[0]);
  }), []);

  // Derived premium from live env
  const livePremiumData = useMemo(() => {
    if (!sel || !liveEnv) return null;
    return calcPremium(sel.city, sel.jobType, sel.dailyIncome, liveEnv);
  }, [sel, liveEnv]);

  const riskScore = useMemo(() => liveEnv ? calcRiskScore(liveEnv) : 50, [liveEnv]);

  const fireSimTrigger = (type) => {
    if (!sel) return;
    const oldPremium = livePremiumData?.premium || sel.premium;
    setPrevPremium(oldPremium);
    const newEnv = getEnvReadings(sel.city, type);
    setLiveEnv(newEnv);
    setActiveTrigger(type);
    setLastUpdated(new Date());

    // Compute new premium to show glow
    const newPD = calcPremium(sel.city, sel.jobType, sel.dailyIncome, newEnv);
    const delta = newPD.premium - oldPremium;
    setPremiumGlow(delta > 0 ? 'up' : delta < 0 ? 'down' : null);
    setTimeout(() => setPremiumGlow(null), 2500);

    // Build AI insight
    const insight = buildAIExplanation(sel.city, sel.jobType, newPD, newEnv, oldPremium);
    setAiInsight(insight);
    toast.info(`⚡ ${type} trigger simulated → Premium recalculated`);
  };

  const resetEnv = () => {
    if (!sel) return;
    const env = getEnvReadings(sel.city, null);
    const oldPremium = livePremiumData?.premium || sel.premium;
    setPrevPremium(oldPremium);
    setLiveEnv(env);
    setActiveTrigger(null);
    setPremiumGlow(null);
    setAiInsight('');
    setLastUpdated(new Date());
  };

  if (policies.length === 0) return (
    <div className="fade-up">
      <div className="ph"><div className="ph-left"><div className="ph-title">Policy Center</div></div></div>
      <div className="empty">
        <div className="empty-icon">📜</div>
        <div className="empty-t">No policies yet</div>
        <div className="empty-s">Register a gig worker to auto-create a policy</div>
        <button className="btn btn-pr btn-sm" style={{marginTop:14}} onClick={()=>setPage('register')}>+ Register Worker</button>
      </div>
    </div>
  );

  const displayPremium = livePremiumData?.premium ?? sel?.premium ?? 0;
  const glowStyle = premiumGlow === 'up'
    ? {boxShadow:'0 0 0 3px rgba(220,38,38,0.2)',borderColor:'var(--red)',transition:'all 0.3s'}
    : premiumGlow === 'down'
    ? {boxShadow:'0 0 0 3px rgba(22,163,74,0.2)',borderColor:'var(--green)',transition:'all 0.3s'}
    : {transition:'all 0.6s'};

  const incomeStability = sel ? (sel.dailyIncome >= 1500 ? 'High' : sel.dailyIncome >= 800 ? 'Medium' : 'Low') : 'Medium';
  const disruptionPct = riskScore;

  return (
    <div className="fade-up">
      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">My Policy</div>
          <div className="ph-sub">
            <span className="live-pill"><span className="live-dot-outer"/><span>Live · AI Premium Engine</span></span>
            <span style={{color:'var(--text4)',fontSize:11}}>· Premium recalculated dynamically</span>
          </div>
        </div>
        <div className="ph-right">
          <span className="update-pill">● Live data connected</span>
          <button className="btn btn-pr btn-sm" onClick={()=>setPage('register')}>+ New Policy</button>
        </div>
      </div>

      {/* POLICY SELECTOR */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10.5,color:'var(--text4)',textTransform:'uppercase',letterSpacing:1,marginBottom:8,fontWeight:700}}>Select Policy</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {policies.map(p=>(
            <button key={p.id} className={`btn btn-sm ${sel?.id===p.id?'btn-pr':'btn-se'}`} onClick={()=>setSel(p)}>
              <span>{p.userName.split(' ')[0]}</span>
              <span style={{opacity:0.5,fontSize:10}}>·</span>
              <span style={{fontSize:11}}>{p.city}</span>
              <span className={`badge ${RISK_BADGE[CITY_DATA[p.city]?.risk||'MEDIUM']}`} style={{fontSize:9,padding:'1px 5px'}}>{CITY_DATA[p.city]?.risk?.slice(0,3)||'MED'}</span>
            </button>
          ))}
        </div>
      </div>

      {sel && livePremiumData && (
        <div className="fade-in">
          {/* STATUS STRIP */}
          <div className="status-strip">
            <span>🟢</span>
            <span>Active &amp; Protected</span>
            <span style={{marginLeft:'auto',color:'var(--text4)',fontWeight:400,fontSize:11}}>
              Last updated: {lastUpdated ? lastUpdated.toLocaleTimeString('en-IN') : 'just now'}
            </span>
          </div>

          {/* POLICY HERO */}
          <div style={{marginBottom:16}}>
            <PolicyHero policy={{...sel, premium: displayPremium}}/>
          </div>

          {/* ── WORKER PROFILE INTELLIGENCE ── */}
          <div className="section-divider">
            <div className="section-divider-line"/>
            <div className="section-divider-text">Worker Profile Intelligence</div>
            <div className="section-divider-line"/>
          </div>

          <div className="wi-panel">
            {/* Worker ID Header */}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
              <div className="wi-avatar">{sel.userName.slice(0,1)}</div>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:16,color:'var(--text)'}}>{sel.userName}</div>
                <div style={{fontSize:11,color:'var(--text4)',fontFamily:'IBM Plex Mono',marginTop:2}}>ID: {sel.userId || sel.id}</div>
              </div>
              <div style={{textAlign:'right'}}>
                {(() => {
                  const lEnv = liveEnv || getEnvReadings(sel.city, null);
                  const imp = calcIncomeLoss(sel, lEnv);
                  const isDisrupted = imp.loss > 0;
                  return (
                    <div>
                      <div style={{
                        display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',
                        borderRadius:99,fontWeight:800,fontSize:11,
                        background: isDisrupted ? '#fef2f2' : 'var(--green-mid)',
                        color: isDisrupted ? 'var(--red2)' : 'var(--green2)',
                        border: `1.5px solid ${isDisrupted ? '#fca5a5' : '#86efac'}`,
                        animation: isDisrupted ? 'blink 2s ease infinite' : 'none'
                      }}>
                        {isDisrupted ? '🔴 STOPPED' : '🟢 WORKING'}
                      </div>
                      {isDisrupted && (
                        <div style={{fontSize:10,color:'var(--red2)',marginTop:5,fontWeight:700,textAlign:'right'}}>
                          ⚠ Worker unable to work → income loss detected
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            </div>

            {/* Core Worker Fields Grid */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
              {[
                { label:'Worker ID', value: (sel.userId||sel.id).slice(0,10), color:'var(--text3)', mono:true },
                { label:'Job Type',  value: sel.jobType,                       color:'var(--blue)' },
                { label:'City',      value: sel.city,                          color:'var(--purple)' },
              ].map(({label,value,color,mono})=>(
                <div key={label} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px'}}>
                  <div style={{fontSize:9.5,textTransform:'uppercase',letterSpacing:0.8,color:'var(--text4)',fontWeight:700,marginBottom:5}}>{label}</div>
                  <div style={{fontSize:12.5,fontWeight:700,color,fontFamily:mono?'IBM Plex Mono':undefined,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{value}</div>
                </div>
              ))}
            </div>

            {/* Income Metrics Row */}
            {(() => {
              const lEnv = liveEnv || getEnvReadings(sel.city, null);
              const imp = calcIncomeLoss(sel, lEnv);
              const statusColor = imp.loss > 0 ? 'var(--red2)' : 'var(--green2)';
              return (
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:0,border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',marginBottom:12}}>
                  {[
                    { label:'Daily Income', value:`₹${sel.dailyIncome}`, color:'var(--blue)', bg:'#eff6ff' },
                    { label:'Earnings Today', value:`₹${imp.adjusted}`, color:imp.loss>0?'var(--amber2)':'var(--green2)', bg:imp.loss>0?'#fffbeb':'#f0fdf4' },
                    { label:'Loss Today', value: imp.loss > 0 ? `₹${imp.loss}` : '₹0', color:imp.loss>0?'var(--red2)':'var(--green2)', bg:imp.loss>0?'#fef2f2':'#f0fdf4' },
                    { label:'Payout Due', value: imp.payout > 0 ? `₹${imp.payout}` : '—', color:imp.payout>0?'var(--amber)':'var(--text4)', bg:imp.payout>0?'#fffbeb':'var(--bg3)' },
                  ].map(({label,value,color,bg},i)=>(
                    <div key={label} style={{background:bg,padding:'10px 12px',textAlign:'center',borderRight: i<3?'1px solid var(--border)':'none'}}>
                      <div style={{fontSize:9,textTransform:'uppercase',letterSpacing:0.8,color:'var(--text4)',fontWeight:700,marginBottom:4}}>{label}</div>
                      <div style={{fontSize:16,fontWeight:900,color,fontFamily:'IBM Plex Mono',lineHeight:1}}>{value}</div>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Disruption Alert Banner */}
            {(() => {
              const lEnv = liveEnv || getEnvReadings(sel.city, null);
              const imp = calcIncomeLoss(sel, lEnv);
              if (imp.loss === 0) return (
                <div style={{padding:'10px 14px',background:'var(--green-light)',border:'1px solid var(--green-mid)',borderRadius:9,fontSize:12,color:'var(--green2)',fontWeight:600,display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <span>✅</span><span>{sel.userName} is working normally — no income disruption detected today</span>
                </div>
              );
              return (
                <div style={{padding:'12px 14px',background:'#fef2f2',border:'1.5px solid #fca5a5',borderRadius:9,marginBottom:12,animation:'triggerPulse 2.5s ease infinite'}}>
                  <div style={{fontSize:12.5,fontWeight:800,color:'var(--red2)',marginBottom:4}}>🚨 Worker operations disrupted</div>
                  <div style={{fontSize:11.5,color:'var(--red2)',lineHeight:1.6}}>
                    {imp.factors.map(f=>f.label).join(' + ')} → income impacted → ₹{imp.loss} loss detected → payout of ₹{imp.payout} initiated
                  </div>
                </div>
              );
            })()}

            <div className="wi-grid">
              {[
                ['Income Stability', incomeStability, incomeStability==='High'?'var(--green)':incomeStability==='Medium'?'var(--amber)':'var(--red)'],
                ['Risk Category', CITY_DATA[sel.city]?.risk||'MEDIUM', RISK_COLOR[CITY_DATA[sel.city]?.risk||'MEDIUM']],
                ['Coverage', `₹${sel.coverage}/trigger`, 'var(--green)'],
                ['Claims So Far', sel.claimsCount||0, 'var(--text)'],
                ['Work Hours', '8 hrs/day', 'var(--purple)'],
                ['Policy Status', 'ACTIVE', 'var(--green)'],
              ].map(([l,v,c])=>(
                <div key={l} className="wi-stat">
                  <div className="wi-stat-l">{l}</div>
                  <div className="wi-stat-v" style={{color:c}}>{v}</div>
                </div>
              ))}
            </div>

            {/* WORKER ANALYTICS */}
            <div style={{marginTop:14,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {/* Earnings trend */}
              <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:12}}>
                <div style={{fontSize:10.5,color:'var(--text4)',fontWeight:700,textTransform:'uppercase',letterSpacing:0.5,marginBottom:8}}>📈 Earnings Trend</div>
                <div style={{fontSize:14,fontWeight:800,color:'var(--text)'}}>₹{sel.dailyIncome?.toLocaleString('en-IN')}<span style={{fontSize:11,color:'var(--text4)',fontWeight:400}}>/day avg</span></div>
                <div style={{marginTop:8,display:'flex',gap:3,alignItems:'flex-end',height:32}}>
                  {[0.6,0.8,0.5,0.9,0.75,1,0.85].map((h,i)=>(
                    <div key={i} style={{flex:1,background:i===5?'var(--blue)':'var(--blue-mid)',borderRadius:'3px 3px 0 0',height:`${h*100}%`,transition:'height 0.5s ease'}}/>
                  ))}
                </div>
                <div style={{fontSize:10,color:'var(--text4)',marginTop:4}}>Mon → Sun this week</div>
              </div>
              {/* Income disruption probability */}
              <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:12}}>
                <div style={{fontSize:10.5,color:'var(--text4)',fontWeight:700,textTransform:'uppercase',letterSpacing:0.5,marginBottom:8}}>⚠️ Disruption Risk</div>
                <div style={{fontSize:14,fontWeight:800,color:disruptionPct>70?'var(--red)':disruptionPct>40?'var(--amber)':'var(--green)'}}>{disruptionPct}%<span style={{fontSize:11,color:'var(--text4)',fontWeight:400}}> probability</span></div>
                <div style={{marginTop:8}}>
                  {liveEnv && [
                    ['AQI', liveEnv.aqi>300?'High':liveEnv.aqi>150?'Medium':'Low', liveEnv.aqi>300?'var(--red)':liveEnv.aqi>150?'var(--amber)':'var(--green)'],
                    ['Rain', liveEnv.rainfall>50?'High':liveEnv.rainfall>30?'Medium':'Low', liveEnv.rainfall>50?'var(--red)':liveEnv.rainfall>30?'var(--amber)':'var(--green)'],
                    ['Traffic', liveEnv.traffic==='SEVERE'?'High':liveEnv.traffic==='HIGH'?'Medium':'Low', liveEnv.traffic==='SEVERE'?'var(--red)':liveEnv.traffic==='HIGH'?'var(--amber)':'var(--green)'],
                  ].map(([l,v,c])=>(
                    <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
                      <span style={{color:'var(--text3)'}}>{l}:</span>
                      <span style={{color:c,fontWeight:700}}>{v}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* MAIN TWO-COLUMN LAYOUT */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

            {/* LEFT: Dynamic Premium Card */}
            <div className="card" style={{...glowStyle}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div className="ct" style={{margin:0}}>💰 Premium Breakdown</div>
                {prevPremium && prevPremium !== displayPremium && (
                  <span style={{fontSize:12,fontWeight:700,
                    color: displayPremium > prevPremium ? 'var(--red2)' : 'var(--green2)',
                    background: displayPremium > prevPremium ? 'var(--red-mid)' : 'var(--green-mid)',
                    padding:'2px 8px',borderRadius:99,animation:'fadeUp 0.4s ease both'}}>
                    {displayPremium > prevPremium ? `+₹${displayPremium-prevPremium}` : `-₹${prevPremium-displayPremium}`}
                  </span>
                )}
              </div>

              {/* Big premium number */}
              <div style={{textAlign:'center',padding:'10px 0 14px',position:'relative'}}>
                <div style={{fontSize:10,color:'var(--text4)',textTransform:'uppercase',letterSpacing:1,marginBottom:6,fontWeight:600}}>Weekly Premium</div>
                <div style={{
                  fontSize:52,fontWeight:800,lineHeight:1,letterSpacing:'-1px',
                  color: premiumGlow==='up' ? 'var(--red)' : premiumGlow==='down' ? 'var(--green)' : 'var(--amber)',
                  transition:'color 0.4s'
                }}>
                  <AnimatedNumber value={displayPremium}/>
                </div>
                <div style={{fontSize:11,color:'var(--text4)',marginTop:4}}>per week · auto-deducted</div>
              </div>

              {/* Clean premium breakdown table */}
              <div className="premium-breakdown">
                <div className="pb-row">
                  <span className="pb-label">Base Premium</span>
                  <span className="pb-value" style={{color:'var(--text2)'}}>₹20</span>
                </div>
                <div className="pb-row">
                  <span className="pb-label">City Risk ({sel.city})</span>
                  <span className="pb-value" style={{color:RISK_COLOR[livePremiumData.cityRiskLabel]}}>+₹{livePremiumData.cityRisk*10}</span>
                </div>
                <div className="pb-row">
                  <span className="pb-label">Job Risk ({sel.jobType})</span>
                  <span className="pb-value" style={{color:'var(--blue)'}}>+₹{livePremiumData.jobRisk*5}</span>
                </div>
                <div className="pb-row">
                  <span className="pb-label">Environment Risk</span>
                  <span className="pb-value" style={{color:livePremiumData.envRisk>=5?'var(--red)':livePremiumData.envRisk>=3?'var(--amber)':'var(--green)'}}>+₹{livePremiumData.envRisk*10}</span>
                </div>
                <div className="pb-row">
                  <span style={{color:'var(--text)',fontWeight:800}}>TOTAL / Week</span>
                  <span style={{fontSize:18,fontWeight:800,color:'var(--amber)'}}>₹{displayPremium}</span>
                </div>
              </div>

              <div style={{marginTop:10,padding:'8px 10px',background:'var(--blue-light)',border:'1px solid var(--blue-mid)',borderRadius:8,fontSize:11,color:'var(--blue2)'}}>
                🔄 Premium recalculated dynamically based on live sensor data
              </div>
            </div>

            {/* RIGHT: Risk Score + Triggers */}
            <div style={{display:'flex',flexDirection:'column',gap:14}}>

              {/* Risk Score Ring */}
              <div className="card" style={{padding:18}}>
                <div className="ct">📊 Risk Score</div>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  <RiskRing pct={riskScore} size={90}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11,color:'var(--text4)',marginBottom:6,fontWeight:600}}>Risk factors:</div>
                    {liveEnv && [
                      ['Rain', `${liveEnv.rainfall}mm`, liveEnv.rainfall>50?'var(--red)':liveEnv.rainfall>30?'var(--amber)':'var(--green)', Math.min((liveEnv.rainfall/80)*100,100)],
                      ['AQI', `${liveEnv.aqi}`, liveEnv.aqi>300?'var(--red)':liveEnv.aqi>150?'var(--amber)':'var(--green)', Math.min((liveEnv.aqi/400)*100,100)],
                      ['Traffic', liveEnv.traffic, liveEnv.traffic==='SEVERE'?'var(--red)':liveEnv.traffic==='HIGH'?'var(--amber)':'var(--green)', {LOW:10,MODERATE:35,HIGH:65,SEVERE:95}[liveEnv.traffic]],
                      ['Temp', `${liveEnv.temp}°C`, liveEnv.temp>40?'var(--red)':liveEnv.temp>35?'var(--amber)':'var(--green)', Math.min(Math.max(((liveEnv.temp-25)/20)*100,0),100)],
                    ].map(([l,v,c,pct])=>(
                      <div key={l} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                        <span style={{fontSize:11,color:'var(--text4)',width:40,fontWeight:500}}>{l}</span>
                        <div style={{flex:1,height:5,background:'var(--bg4)',borderRadius:3,overflow:'hidden'}}>
                          <div style={{height:'100%',background:c,width:`${pct}%`,transition:'width 0.8s ease',borderRadius:3}}/>
                        </div>
                        <span style={{fontSize:10,color:c,fontFamily:'IBM Plex Mono',width:46,textAlign:'right',fontWeight:600}}>{v}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Simulate Triggers */}
              <div className="card" style={{padding:16}}>
                <div className="ct">⚡ Simulate Live Triggers</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
                  {[
                    {id:'RAIN', icon:'🌧️', label:'Rain', desc:'> 50mm'},
                    {id:'AQI',  icon:'😷', label:'AQI',  desc:'> 300'},
                    {id:'TRAFFIC',icon:'🚦', label:'Traffic', desc:'SEVERE'},
                    {id:'HEAT', icon:'🌡️', label:'Heatwave', desc:'> 40°C'},
                  ].map(t=>(
                    <button key={t.id} onClick={()=>fireSimTrigger(t.id)}
                      className={`btn btn-se btn-sm ${activeTrigger===t.id?`trig-active-${t.id.toLowerCase()===`traffic`?`traffic`:t.id.toLowerCase().startsWith('a')?`aqi`:t.id.toLowerCase().startsWith('h')?`heat`:`rain`}`:''}`}
                      style={{justifyContent:'center',flexDirection:'column',gap:2,padding:'9px 6px',transition:'all 0.2s'}}>
                      <span style={{fontSize:16}}>{t.icon}</span>
                      <span style={{fontSize:10.5,fontWeight:700}}>{t.label}</span>
                      <span style={{fontSize:9,color:'var(--text4)'}}>{t.desc}</span>
                    </button>
                  ))}
                </div>
                <button className="btn btn-se btn-sm" style={{width:'100%',marginTop:8,justifyContent:'center',fontSize:11.5}} onClick={resetEnv}>
                  ↺ Reset to baseline
                </button>
              </div>
            </div>
          </div>

          {/* AI INSIGHT PANEL — UPGRADED */}
          <div className="ai-panel" style={{marginTop:16}}>
            <div className="ai-head">
              <div style={{width:28,height:28,borderRadius:8,background:'var(--purple-mid)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>🤖</div>
              <span className="ai-badge-txt">AI Insight Panel</span>
              {activeTrigger && <span className="badge b-re" style={{marginLeft:'auto'}}>● Live Update</span>}
              <span style={{marginLeft:activeTrigger?4:'auto',fontSize:11,color:'var(--text4)'}}>Last updated: 2 sec ago</span>
            </div>
            <div className="ai-expl" style={{fontSize:13}}>
              {aiInsight ||
                `${sel.city} (${CITY_DATA[sel.city]?.risk||'MEDIUM'} risk zone) · AQI ${liveEnv?.aqi||'--'} · Traffic ${liveEnv?.traffic||'--'} detected → ${sel.jobType} income disruption risk at ${riskScore}% → premium set at ₹${displayPremium}/week accordingly. Simulate a trigger above to see real-time premium adjustment.`
              }
            </div>
            <div style={{marginTop:12}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text4)',marginBottom:5,fontWeight:600}}>
                <span>Income Disruption Probability</span>
                <span style={{color:riskScore>70?'var(--red)':riskScore>40?'var(--amber)':'var(--green)',fontWeight:700}}>→ {disruptionPct}%</span>
              </div>
              <div className="ai-bar-wrap">
                <div className="ai-bar" style={{width:`${riskScore}%`}}/>
              </div>
            </div>
          </div>

          {/* POLICY STATS */}
          <div style={{marginTop:14}}>
            <div className="card">
              <div className="ct">📋 Policy Details</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0}}>
                {[
                  ['Policy ID', sel.id],
                  ['Status', sel.status],
                  ['Daily Income', `₹${sel.dailyIncome?.toLocaleString('en-IN')}`],
                  ['Coverage / Trigger', `₹${sel.coverage}`],
                  ['Claims Made', sel.claimsCount||0],
                  ['Total Received', `₹${sel.totalPaid||0}`],
                  ['Policy Since', new Date(sel.createdAt).toLocaleDateString('en-IN')],
                  ['Last Trigger', sel.lastTrigger || 'None'],
                ].map(([k,v],i)=>(
                  <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid var(--border)',fontSize:12.5,borderRight:i%2===0?'1px solid var(--border)':'none',background:i<2?'var(--bg3)':'var(--card)'}}>
                    <span style={{color:'var(--text3)',fontWeight:500}}>{k}</span>
                    <span style={{fontWeight:600,color:'var(--text)',fontFamily:k.includes('ID')?'IBM Plex Mono':'inherit',fontSize:k.includes('ID')?10.5:12.5}}>{String(v)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// TRIGGERS — AI-DRIVEN PARAMETRIC ENGINE v5
// ══════════════════════════════════════════════════════════
const Triggers = ({ setPage, setPipeline }) => {
  const [city, setCity] = useState('Mumbai');
  const [firing, setFiring] = useState(null);
  const [tick, setTick] = useState(0);
  const [aiInsight, setAiInsight] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [an, setAn] = useState(api.getAnalytics());

  // Live sensors — update every 2 seconds
  const [sensors, setSensors] = useState(() => getEnvReadings(city, null));
  useEffect(() => { setSensors(getEnvReadings(city, null)); }, [city]);
  useEffect(() => {
    const t = setInterval(() => {
      setSensors(getEnvReadings(city, null));
      setTick(p => p + 1);
    }, 2000);
    return () => clearInterval(t);
  }, [city]);
  useEffect(() => subscribe(() => setAn(api.getAnalytics())), []);

  const TDEFS = [
    { id:'RAIN',    icon:'🌧️', name:'Heavy Rainfall',   desc:'Extreme rainfall forces field workers indoors — income disrupted', thresh:'> 50mm/hr', src:'IMD Weather API', color:'#2563eb', barColor:'#3b82f6' },
    { id:'AQI',     icon:'😷', name:'Hazardous AQI',    desc:'Air quality hazard — delivery workers cannot operate safely',       thresh:'> 300 AQI',   src:'CPCB API',       color:'#d97706', barColor:'#f59e0b' },
    { id:'TRAFFIC', icon:'🚦', name:'Severe Traffic',   desc:'Route blockage — delivery SLAs missed, income loss confirmed',       thresh:'SEVERE level', src:'Traffic Intel API', color:'#dc2626', barColor:'#ef4444' },
    { id:'HEAT',    icon:'🌡️', name:'Extreme Heatwave', desc:'Dangerous outdoor temperatures — gig work physically impossible',    thresh:'> 40°C',     src:'IMD Weather API', color:'#ea580c', barColor:'#f97316' },
  ];

  // Determine triggered status per sensor (strict threshold logic)
  const isTriggered = {
    RAIN:    sensors.rainfall > 50,
    AQI:     sensors.aqi > 300,
    TRAFFIC: sensors.traffic === 'SEVERE',
    HEAT:    sensors.temp > 40,
  };

  const liveVals = {
    RAIN:    `${sensors.rainfall}mm`,
    AQI:     `${sensors.aqi}`,
    TRAFFIC: sensors.traffic,
    HEAT:    `${sensors.temp}°C`,
  };

  const barPcts = {
    RAIN:    Math.min((sensors.rainfall / 80) * 100, 100),
    AQI:     Math.min((sensors.aqi / 400) * 100, 100),
    TRAFFIC: {LOW:10,MODERATE:35,HIGH:65,SEVERE:100}[sensors.traffic] || 30,
    HEAT:    Math.min(Math.max(((sensors.temp - 20) / 30) * 100, 5), 100),
  };

  const anyTriggered = Object.values(isTriggered).some(Boolean);
  const triggeredCount = Object.values(isTriggered).filter(Boolean).length;
  const affectedCount = DB.policies.filter(p => p.status==='ACTIVE' && p.city===city).length;
  const estimatedWorkers = affectedCount > 0 ? affectedCount : Math.floor(Math.random() * 80 + 60);
  const incomeLoss = 500;
  const totalLoss = estimatedWorkers * incomeLoss;

  // Build primary triggered sensor description for AI
  const buildInsightText = () => {
    const parts = [];
    if (isTriggered.RAIN)    parts.push(`Worker operations disrupted due to heavy rainfall (${sensors.rainfall}mm/hr) in ${city} → outdoor delivery impossible → income impacted → payout initiated automatically.`);
    if (isTriggered.AQI)     parts.push(`Worker operations disrupted due to hazardous AQI (${sensors.aqi}) in ${city} → health risk prevents outdoor work → income impacted → payout initiated automatically.`);
    if (isTriggered.TRAFFIC) parts.push(`Worker operations disrupted due to severe traffic congestion in ${city} → delivery routes blocked, zero movement possible → income impacted → payout initiated automatically.`);
    if (isTriggered.HEAT)    parts.push(`Worker operations disrupted due to extreme heat (${sensors.temp}°C) in ${city} → outdoor gig work physically unsafe → income impacted → payout initiated automatically.`);
    if (parts.length === 0)  return `All ${affectedCount||estimatedWorkers} workers in ${city} are operating normally. Sensors show Rainfall ${sensors.rainfall}mm (safe), AQI ${sensors.aqi} (safe), Temp ${sensors.temp}°C (safe), Traffic ${sensors.traffic}. Worker income is fully protected — no payout required.`;
    return parts.join(' ');
  };

  const fetchAIInsight = async () => {
    setAiLoading(true);
    const envStr = `Rainfall:${sensors.rainfall}mm, AQI:${sensors.aqi}, Temp:${sensors.temp}°C, Traffic:${sensors.traffic}`;
    const triggeredList = Object.entries(isTriggered).filter(([,v])=>v).map(([k])=>k).join(', ') || 'NONE';
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514', max_tokens:120,
          messages:[{role:'user',content:`You are IncomeShield AI — a worker income protection system for gig workers in India.
City: ${city}. Live sensor data: ${envStr}. Triggered parameters: ${triggeredList}.
Affected workers: ~${estimatedWorkers}. Expected income loss: ₹${totalLoss}.
Write exactly ONE sentence (max 45 words) explaining the causal chain in this pattern: "Worker operations disrupted due to [cause] → income impacted → payout initiated." Be specific with the sensor values and city name. Make it sound like a real insurance decision, not a tech alert.`}]
        })
      });
      const d = await res.json();
      const txt = d.content?.map(b=>b.text||'').join('').trim();
      setAiInsight(txt || buildInsightText());
    } catch {
      setAiInsight(buildInsightText());
    }
    setAiLoading(false);
  };

  useEffect(() => {
    setAiInsight('');
  }, [city]);

  const fire = async (tid) => {
    if (affectedCount === 0) { toast.warn(`No active policies in ${city}. Register a worker first.`); return; }
    setFiring(tid);
    toast.info(`🚨 ${tid} parametric trigger fired → processing ${affectedCount} claims`);
    await sleep(400);
    // Update analytics
    setPipeline({ triggerId: tid, city, active: true });
    setPage('pipeline');
    setFiring(null);
  };

  const decisionBg = anyTriggered
    ? 'linear-gradient(135deg,#450a0a 0%,#7f1d1d 60%,#991b1b 100%)'
    : 'linear-gradient(135deg,#052e16 0%,#14532d 60%,#166534 100%)';

  return (
    <div className="fade-up">
      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">⚡ Parametric Trigger Engine</div>
          <div className="ph-sub" style={{display:'flex',alignItems:'center',gap:10}}>
            <span>Real-time sensor monitoring → automated payout decision</span>
            <span className="live-update-badge"><span className="live-dot-outer"/><span>LIVE · Auto-refresh every 2s</span></span>
          </div>
        </div>
        <div className="ph-right">
          <CitySearch value={city} onChange={setCity}/>
        </div>
      </div>

      {/* ══ MASTER DECISION PANEL ══ */}
      <div className="master-decision" style={{background:decisionBg,border:`2px solid ${anyTriggered?'#dc2626':'#16a34a'}`,boxShadow:`0 0 0 4px ${anyTriggered?'rgba(220,38,38,0.15)':'rgba(22,163,74,0.12)'},0 10px 28px rgba(0,0,0,0.15)`}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>
          <div>
            <div className="master-decision-label">🤖 System Decision — {city}</div>
            <div className="master-decision-title">
              {anyTriggered ? '🚨 AUTO PAYOUT ACTIVATED' : '✅ SYSTEM SAFE — MONITORING'}
            </div>
            <div className="master-decision-sub">
              {anyTriggered
                ? `${triggeredCount} threshold${triggeredCount>1?'s':''} breached · loss-matched payouts auto-initiated for ${affectedCount||estimatedWorkers} workers · Zero human intervention`
                : `All ${Object.keys(isTriggered).length} parameters within safe range · No payouts required · Continuous monitoring active`}
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
              {anyTriggered && (
                <div className="master-decision-badge payout">
                  <span>💸</span><span>PAYOUT PIPELINE: OPEN</span>
                </div>
              )}
              {!anyTriggered && (
                <div className="master-decision-badge safe">
                  <span>🛡️</span><span>ALL SENSORS: SAFE</span>
                </div>
              )}
              {affectedCount > 0 && (
                <div className="master-decision-badge" style={{background:'rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.85)',border:'1.5px solid rgba(255,255,255,0.2)'}}>
                  <span>👥</span><span>{affectedCount} active {affectedCount===1?'policy':'policies'} in {city}</span>
                </div>
              )}
            </div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontSize:52,fontWeight:900,color:'#fff',lineHeight:1,fontFamily:'IBM Plex Mono'}}>
              {triggeredCount}/{Object.keys(isTriggered).length}
            </div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.6)',letterSpacing:1,textTransform:'uppercase',fontWeight:600,marginTop:3}}>
              Triggers Active
            </div>
          </div>
        </div>
      </div>

      {/* ══ CITY QUICK-SELECT ══ */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
        {['Mumbai','Delhi','Chennai','Bengaluru','Kolkata','Hyderabad','Pune'].map(c=>{
          const has = DB.policies.some(p=>p.city===c && p.status==='ACTIVE');
          return (
            <button key={c} className={`btn btn-sm ${city===c?'btn-pr':'btn-se'}`} onClick={()=>setCity(c)} style={{fontSize:11,padding:'4px 10px'}}>
              {c} {has && <span style={{fontSize:8,background:'var(--green-mid)',borderRadius:99,padding:'1px 4px',color:'var(--green2)',marginLeft:3}}>●</span>}
            </button>
          );
        })}
      </div>

      {/* ══ TRIGGER CARDS GRID ══ */}
      <div className="tg" style={{marginBottom:18}}>
        {TDEFS.map(t => {
          const triggered = isTriggered[t.id];
          const pct = barPcts[t.id];
          return (
            <div
              key={t.id}
              className={`tb ${triggered ? 'triggered' : 'safe'}`}
              onClick={()=>!firing&&triggered&&fire(t.id)}
              style={{
                cursor: firing ? 'not-allowed' : triggered ? 'pointer' : 'default',
                opacity: firing && firing !== t.id ? 0.55 : 1,
              }}
            >
              {/* Top row: icon + status label */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <span className="tb-icon" style={{marginBottom:0,fontSize:28}}>{t.icon}</span>
                <span className={`tb-status-label ${triggered?'triggered':'safe'}`}>
                  {triggered ? '🔴 TRIGGERED' : '🟢 SAFE'}
                </span>
              </div>

              <div className="tb-name">{t.name}</div>
              <div className="tb-desc" style={{marginBottom:10}}>{t.desc}</div>

              {/* Threshold + Live Value */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                <span className="tb-thresh" style={{background:triggered?'#fee2e2':undefined,borderColor:triggered?'#fca5a5':undefined,color:triggered?'var(--red2)':undefined}}>
                  Threshold: {t.thresh}
                </span>
                <span className="tb-val" style={{color:triggered?'var(--red2)':'var(--green2)',fontSize:15}}>
                  {liveVals[t.id]}
                </span>
              </div>

              {/* Progress bar */}
              <div className="tb-bar" style={{marginTop:10,background:triggered?'#fee2e2':'#dcfce7'}}>
                <div className="tb-bar-fill" style={{
                  width:`${pct}%`,
                  background: triggered
                    ? `linear-gradient(90deg, ${t.barColor}, #dc2626)`
                    : `linear-gradient(90deg, #86efac, #16a34a)`,
                }}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:9.5,color:'var(--text4)'}}>
                <span>0</span>
                <span style={{color:triggered?'var(--red2)':'var(--text4)',fontWeight:triggered?700:400}}>
                  {pct.toFixed(0)}% of max threshold
                </span>
              </div>

              <div style={{marginTop:10,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontSize:10,color:'var(--text4)',fontFamily:'IBM Plex Mono'}}>📡 {t.src}</span>
                {triggered && (
                  <span className="badge b-re" style={{fontSize:9,animation:'blink 1.5s ease infinite'}}>
                    ⚡ PAYOUT ELIGIBLE
                  </span>
                )}
              </div>

              {triggered && (
                <div style={{marginTop:10,padding:'8px 10px',background:'rgba(220,38,38,0.08)',border:'1px solid rgba(220,38,38,0.2)',borderRadius:7,fontSize:11,color:'var(--red2)',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
                  <span>🚨</span>
                  <span>Click to launch claim pipeline → loss-matched auto-payout per worker</span>
                </div>
              )}
              {!triggered && (
                <div style={{marginTop:10,padding:'7px 10px',background:'rgba(22,163,74,0.06)',border:'1px solid rgba(22,163,74,0.15)',borderRadius:7,fontSize:11,color:'var(--green2)',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
                  <span>✅</span><span>No action required — within safe range</span>
                </div>
              )}
              {firing === t.id && (
                <div style={{marginTop:10,display:'flex',alignItems:'center',gap:7,fontSize:12,color:'var(--blue)',fontWeight:600}}>
                  <span className="sp sp-sm"/>Launching pipeline…
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ══ WORKER IMPACT PANEL ══ */}
      {anyTriggered && (
        <div className="impact-strip fade-in" style={{marginBottom:18}}>
          <div style={{gridColumn:'1/-1',marginBottom:12}}>
            <div style={{fontWeight:800,fontSize:14,color:'#78350f',marginBottom:2}}>📊 Estimated Worker Impact</div>
            <div style={{fontSize:12,color:'#92400e'}}>Based on active policies in {city} + city worker density model</div>
          </div>
          <div className="impact-stat">
            <div className="impact-stat-label">Workers Affected</div>
            <div className="impact-stat-val">{affectedCount > 0 ? affectedCount : estimatedWorkers}</div>
          </div>
          <div className="impact-stat">
            <div className="impact-stat-label">Income Loss / Worker</div>
            <div className="impact-stat-val">₹{incomeLoss}</div>
          </div>
          <div className="impact-stat">
            <div className="impact-stat-label">Total Auto-Payout</div>
            <div className="impact-stat-val">₹{((affectedCount||estimatedWorkers)*incomeLoss).toLocaleString('en-IN')}</div>
          </div>
        </div>
      )}

      {/* ══ AI INSIGHT PANEL ══ */}
      <div className={anyTriggered ? 'ai-insight-triggered' : 'ai-panel'} style={{marginBottom:18}}>
        <div className="ai-head" style={{marginBottom:0}}>
          <div style={{width:30,height:30,borderRadius:8,background:anyTriggered?'rgba(99,102,241,0.3)':'var(--purple-mid)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>🤖</div>
          <span className="ai-badge-txt" style={{color:anyTriggered?'#c7d2fe':undefined}}>
            AI Insight — {anyTriggered ? 'Payout Justification' : 'Risk Assessment'}
          </span>
          <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
            {anyTriggered && <span className="badge" style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5',border:'1px solid rgba(239,68,68,0.3)',fontSize:10}}>🚨 THRESHOLD BREACHED</span>}
            <button className="btn btn-sm" style={{fontSize:11,background:anyTriggered?'rgba(255,255,255,0.12)':'var(--purple-mid)',color:anyTriggered?'#c7d2fe':'var(--purple)',border:'none',padding:'5px 12px'}}
              onClick={fetchAIInsight} disabled={aiLoading}>
              {aiLoading ? <><span className="sp sp-sm" style={{borderTopColor:anyTriggered?'#c7d2fe':'var(--purple)'}}/>Analyzing…</> : '⚡ Run AI Analysis'}
            </button>
          </div>
        </div>
        {(aiInsight || !aiLoading) && (
          <div className="ai-expl" style={{marginTop:12,fontSize:13,color:anyTriggered?'rgba(255,255,255,0.9)':undefined,borderLeftColor:anyTriggered?'#818cf8':undefined}}>
            {aiInsight || buildInsightText()}
          </div>
        )}
        {aiLoading && !aiInsight && (
          <div style={{marginTop:12,display:'flex',gap:8,alignItems:'center',fontSize:12,color:anyTriggered?'rgba(255,255,255,0.6)':'var(--text4)'}}>
            <span className="sp sp-sm" style={{borderTopColor:anyTriggered?'#818cf8':'var(--purple)'}}/>
            Querying Anthropic AI for causal explanation…
          </div>
        )}
      </div>

      {/* ══ LIVE SENSOR FEED (compact, below) ══ */}
      <div className="card card-sm" style={{marginBottom:18}}>
        <div className="ct" style={{marginBottom:10}}>
          <span className="live-update-badge" style={{fontSize:10}}>
            <span className="live-dot-outer"/>
            <span>LIVE SENSOR FEED — {city} · tick #{tick}</span>
          </span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
          {[
            {l:'Rainfall', v:`${sensors.rainfall}mm`, key:'RAIN', thresh:'> 50mm'},
            {l:'AQI Index', v:`${sensors.aqi}`, key:'AQI', thresh:'> 300'},
            {l:'Temperature', v:`${sensors.temp}°C`, key:'HEAT', thresh:'> 40°C'},
            {l:'Traffic', v:sensors.traffic, key:'TRAFFIC', thresh:'SEVERE'},
          ].map(s => {
            const trig = isTriggered[s.key];
            return (
              <div key={s.l} className={`sensor ${trig?'alert':'ok'}`} style={{position:'relative'}}>
                <div className="sensor-label">{s.l}</div>
                <div className="sensor-val" style={{color:trig?'var(--red)':'var(--green)',fontSize:17}}>{s.v}</div>
                <div className="sensor-unit" style={{color:trig?'var(--red2)':'var(--text4)',fontWeight:trig?700:400,fontSize:9}}>
                  {trig ? '⚠ TRIGGERED' : `✓ safe (${s.thresh})`}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ══ POLICY CONTEXT ══ */}
      {affectedCount > 0 ? (
        <div style={{padding:'11px 14px',background:'var(--green-light)',border:'1px solid var(--green-mid)',borderRadius:9,fontSize:12.5,color:'var(--green2)',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:18}}>✅</span>
          <div>
            <strong>{affectedCount} active {affectedCount===1?'policy':'policies'}</strong> found in <strong>{city}</strong> — triggering any breached sensor will auto-process loss-matched claims via zero-touch UPI pipeline
          </div>
        </div>
      ) : (
        <div style={{padding:'11px 14px',background:'var(--amber-light)',border:'1px solid var(--amber-mid)',borderRadius:9,fontSize:12.5,color:'#92400e',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:18}}>⚠️</span>
          <div>No active policies in {city}. <button className="btn btn-se btn-sm" style={{padding:'2px 12px',marginLeft:8}} onClick={()=>setPage('register')}>Register a worker first</button></div>
        </div>
      )}
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// PIPELINE
// ══════════════════════════════════════════════════════════
const Pipeline = ({ pipeline, setPipeline }) => {
  const [steps, setSteps] = useState([]);
  const [doneSet, setDoneSet] = useState(new Set());
  const [activeIdx, setActiveIdx] = useState(-1);
  const [result, setResult] = useState(null);
  const [running, setRunning] = useState(false);
  const [log, setLog] = useState([]);
  const [aiExpl, setAiExpl] = useState('');
  const ranRef = useRef(false);

  const STEP_DEFS = [
    { t:'Trigger Detected',   i:'⚡' },
    { t:'Policy Verified',    i:'📋' },
    { t:'GPS Fraud Check',    i:'📡' },
    { t:'Eligibility Check',  i:'✅' },
    { t:'UPI Payout',         i:'💸' },
    { t:'Record Committed',   i:'📊' },
  ];

  const addLog = (msg, cls='') => setLog(prev => [...prev, { time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), msg, cls }]);

  useEffect(() => {
    if (pipeline?.active && pipeline.triggerId && !ranRef.current) {
      ranRef.current = true;
      runPipeline();
    }
  }, [pipeline]);

  const runPipeline = async () => {
    setRunning(true);
    setSteps(STEP_DEFS);
    setDoneSet(new Set());
    setResult(null);
    setLog([]);
    setActiveIdx(-1);
    setAiExpl('');

    addLog(`Pipeline START: ${pipeline.triggerId} → ${pipeline.city}`);

    const res = await api.processTrigger(pipeline.triggerId, pipeline.city, (sArr, idx, state) => {
      if (state==='active') {
        setActiveIdx(idx);
        addLog(`[${sArr[idx].t}] Processing…`);
      }
      if (state==='done') {
        setDoneSet(prev => new Set([...prev, idx]));
        addLog(`[${sArr[idx].t}] Complete`, 'log-ok');
      }
    });

    setResult(res);
    setRunning(false);
    setPipeline(prev => ({...prev, active:false}));

    const paid = res.results.filter(r=>r.status==='PAID');
    const totalPaid = paid.reduce((s,r)=>s+(r.amount||0),0);
    addLog(`Pipeline COMPLETE: ${paid.length}/${res.affectedCount} claims settled`, 'log-ok');
    toast.success(`✅ ${paid.length} claims settled — ₹${totalPaid} paid out (loss-matched)`);

    // AI explanation
    try {
      const r2 = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514', max_tokens:120,
          messages:[{role:'user',content:`IncomeShield AI: ${pipeline.triggerId} trigger fired in ${pipeline.city}. Env: Rainfall ${res.env?.rainfall}mm, AQI ${res.env?.aqi}, Traffic ${res.env?.traffic}, Temp ${res.env?.temp}°C. Risk score: ${res.riskScore}%. ${res.affectedCount} workers affected. Write one sentence (max 40 words) in this format: "Worker operations disrupted due to [cause] in [city] → income impacted → payout initiated for [N] workers." Be specific with sensor values.`}]
        })
      });
      const d2 = await r2.json();
      setAiExpl(d2.content?.map(b=>b.text||'').join(''));
    } catch {
      setAiExpl(`Worker operations disrupted due to ${pipeline.triggerId} conditions in ${pipeline.city} → income impacted for ${res.affectedCount} workers → loss-matched payout initiated automatically.`);
    }
  };

  if (!pipeline?.triggerId) return (
    <div className="fade-up">
      <div className="ph"><div className="ph-left"><div className="ph-title">Claim Pipeline</div></div></div>
      <div className="empty"><div className="empty-icon">🔁</div><div className="empty-t">No pipeline running</div><div className="empty-s">Simulate a trigger to watch zero-touch processing</div></div>
    </div>
  );

  return (
    <div className="fade-up">
      <div className="ph">
        <div className="ph-left"><div className="ph-title">Zero-Touch Claim Pipeline</div><div className="ph-sub">Automated — no human intervention required</div></div>
        {running && <div className="live-pill"><span className="live-dot-outer"/><span>PROCESSING</span></div>}
        {result && !running && <span className="badge b-gr" style={{fontSize:12}}>✓ COMPLETE</span>}
      </div>

      <div className="g12">
        <div>
          <div className="card card-p" style={{marginBottom:16}}>
            <div className="ct">{pipeline.triggerId} → {pipeline.city}</div>
            {STEP_DEFS.map((s,i) => {
              const isDone = doneSet.has(i);
              const isAct = activeIdx===i && !isDone;
              return (
                <div key={i} className={`ps ${isDone?'done':isAct?'act':''}`}>
                  <div className={`ps-num ${isDone?'done':isAct?'act':''}`}>
                    {isDone ? '✓' : isAct ? <span className="sp sp-sm"/> : i+1}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="ps-title">{s.t}</div>
                    <div className="ps-desc">
                      {isDone && i===0 && `${pipeline.triggerId} threshold exceeded — ${pipeline.city} zone confirmed`}
                      {isDone && i===1 && `${result?.affectedCount||0} active policies verified`}
                      {isDone && i===2 && 'GPS coordinates cross-matched — workers in affected zone'}
                      {isDone && i===3 && 'No duplicate claims — income disruption confirmed'}
                      {isDone && i===4 && `₹${result.results.filter(r=>r.status==='PAID').reduce((s,r)=>s+(r.amount||0),0)} routed via UPI Gateway (loss-matched)`}
                      {isDone && i===5 && 'Claims committed to MongoDB — analytics refreshed'}
                      {isAct && 'Processing…'}
                      {!isDone && !isAct && 'Waiting…'}
                    </div>
                  </div>
                  <span className={`ps-tag ${isDone?'done':isAct?'act':'pen'}`}>
                    {isDone?'✓ Done':isAct?'⟳ Running':'Pending'}
                  </span>
                </div>
              );
            })}
          </div>

          {result && !running && (
            <div className="fade-in">
              {/* RESULT SUMMARY */}
              <div style={{padding:'18px',background:'var(--green-light)',border:'1px solid var(--green-mid)',borderRadius:14,marginBottom:14}}>
                <div style={{fontWeight:800,fontSize:17,fontWeight:800,color:'var(--green2)',marginBottom:12}}>🎉 Pipeline Complete</div>
                <div className="g3">
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:9.5,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Workers</div>
                    <div style={{fontWeight:800,fontSize:26,fontWeight:800,color:'var(--blue)'}}>{result.affectedCount}</div>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:9.5,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Claims Paid</div>
                    <div style={{fontWeight:800,fontSize:26,fontWeight:800,color:'var(--green2)'}}>{result.results.filter(r=>r.status==='PAID').length}</div>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:9.5,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Payout</div>
                    <div style={{fontWeight:800,fontSize:26,fontWeight:800,color:'var(--amber)'}}>₹{result.results.filter(r=>r.status==='PAID').reduce((s,r)=>s+(r.amount||0),0)}</div>
                  </div>
                </div>
              </div>

              {/* ENV DATA */}
              {result.env && (
                <div className="card card-sm" style={{marginBottom:14}}>
                  <div className="ct">📡 Sensor Readings at Trigger</div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
                    {[
                      {l:'Rainfall', v:`${result.env.rainfall}mm`, a:result.env.rainfall>50},
                      {l:'AQI', v:`${result.env.aqi}`, a:result.env.aqi>300},
                      {l:'Temp', v:`${result.env.temp}°C`, a:result.env.temp>40},
                      {l:'Traffic', v:result.env.traffic, a:result.env.traffic==='SEVERE'},
                    ].map(s=>(
                      <div key={s.l} className={`sensor ${s.a?'alert':'ok'}`} style={{padding:'8px 10px'}}>
                        <div className="sensor-label">{s.l}</div>
                        <div className="sensor-val" style={{color:s.a?'var(--red)':'var(--green)',fontSize:14}}>{s.v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* AI EXPLANATION */}
              {aiExpl && (
                <div className="ai-panel">
                  <div className="ai-head"><span>🤖</span><span className="ai-badge-txt">AI Claim Explanation</span></div>
                  <div className="ai-expl">{aiExpl}</div>
                  <div style={{marginTop:10,display:'flex',gap:8,alignItems:'center'}}>
                    <span className="badge b-pu">Risk Score: {result.riskScore}%</span>
                    <span className="badge b-gr">Decision: AUTO-SETTLED</span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* RIGHT: LOG + LEDGER */}
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="card" style={{flex:'0 0 auto'}}>
            <div className="ct">📟 Execution Log</div>
            <div className="scroll" style={{maxHeight:300,overflowY:'auto'}}>
              {log.length===0 && <div style={{color:'var(--text3)',fontSize:12}}>Pipeline not started…</div>}
              {log.map((l,i) => (
                <div key={i} className={`log-entry ${l.cls||''}`}>
                  <span className="log-time">{l.time}</span>
                  <span className="log-msg">{l.msg}</span>
                </div>
              ))}
            </div>
          </div>

          {result && (
            <div className="card fade-in">
              <div className="ct">💸 Payout Ledger</div>
              <div className="scroll" style={{maxHeight:240,overflowY:'auto'}}>
                {result.results.map(r=>(
                  <div key={r.id} style={{padding:'9px 0',borderBottom:'1px solid var(--border)'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                      <span style={{fontSize:12.5,fontWeight:700}}>{r.userName}</span>
                      <span className="amt">₹{r.amount}</span>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span className="mono" style={{color:'var(--text3)',fontSize:10}}>{r.id}</span>
                      <div style={{display:'flex',gap:5}}>
                        <span className={`badge ${r.fraudCheck==='CLEAR'?'b-gr':'b-re'}`} style={{fontSize:9}}>{r.fraudCheck}</span>
                        <span className={`badge ${r.status==='PAID'?'b-gr':'b-re'}`} style={{fontSize:9}}>{r.status}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// CLAIMS CENTER
// ══════════════════════════════════════════════════════════
const ClaimsCenter = () => {
  const [claims, setClaims] = useState([...DB.claims]);
  const [filter, setFilter] = useState('ALL');
  useEffect(() => subscribe(() => setClaims([...DB.claims])), []);

  const TC = { RAIN:'b-bl', AQI:'b-am', TRAFFIC:'b-re', HEAT:'b-or' };
  const TRIGGER_LABEL = { RAIN:'AQI + Rain', AQI:'AQI breach', TRAFFIC:'Traffic block', HEAT:'Heatwave' };
  const filtered = filter==='ALL' ? claims : claims.filter(c=>c.status===filter);
  const an = api.getAnalytics();

  return (
    <div className="fade-up">
      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">Claims Center</div>
          <div className="ph-sub">
            <span className="live-pill"><span className="live-dot-outer"/><span>Live · {filtered.length} claims from DB</span></span>
          </div>
        </div>
        <div className="ph-right">
          {['ALL','PAID','FRAUD_HOLD'].map(f=>(
            <button key={f} className={`btn btn-sm ${filter===f?'btn-pr':'btn-se'}`} onClick={()=>setFilter(f)}>{f}</button>
          ))}
        </div>
      </div>

      <div className="mg" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        {[
          {label:'Total Claims',   value:an.totalClaims,  color:'bl', icon:'📋'},
          {label:'Total Payout',   value:`₹${an.totalPayout.toLocaleString('en-IN')}`,color:'gr', icon:'💰'},
          {label:'Success Rate',   value:`${an.successRate}%`,color:'am', icon:'✅'},
          {label:'Fraud Blocked',  value:`${an.fraudRate}%`, color:'pu', icon:'🛡️'},
        ].map((m,i)=>(
          <div key={i} className={`mc ${m.color}`}>
            <div className={`mc-accent-bar ${m.color}`}/>
            <div className="mc-icon">{m.icon}</div>
            <div className="ml">{m.label}</div>
            <div className={`mv ${m.color}`}>{m.value}</div>
          </div>
        ))}
      </div>

      {filtered.length===0 ? (
        <div className="empty"><div className="empty-icon">💼</div><div className="empty-t">No claims yet</div><div className="empty-s">Simulate a trigger to generate claims automatically</div></div>
      ) : (
        <div className="card" style={{padding:0}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg3)',borderRadius:'12px 12px 0 0'}}>
            <div style={{fontSize:12,fontWeight:700,color:'var(--text3)'}}>Claim History — All auto-settled claims from the parametric trigger engine</div>
          </div>
          <div className="tbl-wrap" style={{border:'none',borderRadius:0}}>
            <table className="tbl">
              <thead>
                <tr>
                  <th>City</th><th>Worker</th><th>Reason</th><th>Amount</th><th>Risk</th><th>Time</th><th>Fraud</th><th>Status</th>
                </tr>
              </thead>
              <tbody>
                {[...filtered].reverse().map(c=>(
                  <tr key={c.id}>
                    <td><span className="claim-row-city">{c.city}</span></td>
                    <td style={{fontWeight:600,color:'var(--text)'}}>{c.userName}</td>
                    <td>
                      <div>
                        <span className={`badge ${TC[c.triggerType]||'b-bl'}`}>{c.triggerType}</span>
                        <div className="claim-row-reason">{TRIGGER_LABEL[c.triggerType]||c.triggerType}</div>
                      </div>
                    </td>
                    <td><span className="amt">₹{c.amount}</span></td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <div style={{width:44,height:5,background:'var(--bg4)',borderRadius:3,overflow:'hidden'}}>
                          <div style={{height:'100%',background:c.riskScore>70?'var(--red)':c.riskScore>40?'var(--amber)':'var(--green)',width:`${c.riskScore||50}%`}}/>
                        </div>
                        <span style={{fontSize:10.5,color:'var(--text4)',fontFamily:'IBM Plex Mono'}}>{c.riskScore||'—'}%</span>
                      </div>
                    </td>
                    <td><span style={{fontFamily:'IBM Plex Mono',fontSize:10.5,color:'var(--text4)'}}>{new Date(c.createdAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></td>
                    <td><span className={`badge ${c.fraudCheck==='CLEAR'?'b-gr':'b-re'}`}>{c.fraudCheck}</span></td>
                    <td><span className={`badge ${c.status==='PAID'?'b-gr':'b-re'}`}>● {c.status}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// ANALYTICS
// ══════════════════════════════════════════════════════════
const Analytics = () => {
  const [an, setAn] = useState(api.getAnalytics());
  useEffect(() => subscribe(() => setAn(api.getAnalytics())), []);

  const cityDist = Object.entries(

const Ledger = () => {
  const [txs, setTxs] = useState([...DB.transactions]);
  useEffect(() => subscribe(() => setTxs([...DB.transactions])), []);
  const total = txs.filter(t=>t.type==='CLAIM_PAYOUT').reduce((s,t)=>s+t.amount,0);

  return (
    <div className="fade-up">
      <div className="ph"><div className="ph-left"><div className="ph-title">Payout Ledger</div><div className="ph-sub">All financial transactions — immutable record</div></div></div>
      <div className="mg" style={{gridTemplateColumns:'repeat(3,1fr)'}}>

        <div className="mc gr"><div className="mc-bg gr"/><div className="ml">Total Paid Out</div><div className="mv gr">₹{total.toLocaleString('en-IN')}</div></div>
        <div className="mc am"><div className="mc-bg am"/><div className="ml">Premium Collected</div><div className="mv am">₹{txs.filter(t=>t.type==='PREMIUM').reduce((s,t)=>s+t.amount,0).toLocaleString('en-IN')}</div></div>
      </div>
      {txs.length===0 ? (
        <div className="empty"><div className="empty-icon">📒</div><div className="empty-t">No transactions yet</div></div>

        <div className="card" style={{padding:0}}>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>TX ID</th><th>Type</th><th>Worker</th><th>Description</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
              <tbody>
                {[...txs].reverse().map(t=>(
                  <tr key={t.id}>
                    <td><span className="mono" style={{fontSize:10.5}}>{t.id.slice(0,12)}…</span></td>
                    <td><span className={`badge ${t.type==='CLAIM_PAYOUT'?'b-gr':'b-bl'}`}>{t.type==='CLAIM_PAYOUT'?'PAYOUT':'PREMIUM'}</span></td>
                    <td style={{fontWeight:600}}>{DB.users.find(u=>u.id===t.userId)?.name||'—'}</td>
                    <td style={{color:'var(--text2)',fontSize:12}}>{t.desc}</td>
                    <td><span className="amt">₹{t.amount}</span></td>

                ))}

            </table>
          </div>
        </div>
      )}
    </div>
  );
};

const calcIncomeLoss = (policy, env) => {
  const income = parseFloat(policy.dailyIncome) || 800;
  let dropFactor = 0; // 0 = no drop
  const factors = [];

  // AQI impact
  if (env.aqi > 300) {
    dropFactor += 0.35; factors.push({ key:'aqi', label:`AQI ${Math.round(env.aqi)}`, icon:'😷', impact:35, cls:'aqi' });
  } else if (env.aqi > 200) {
    dropFactor += 0.15; factors.push({ key:'aqi', label:`AQI ${Math.round(env.aqi)}`, icon:'😷', impact:15, cls:'aqi' });
  }

  // Rainfall impact
  if (env.rainfall > 50) {
    dropFactor += 0.30; factors.push({ key:'rain', label:`Rain ${env.rainfall}mm`, icon:'🌧️', impact:30, cls:'rain' });
  } else if (env.rainfall > 30) {
    dropFactor += 0.12; factors.push({ key:'rain', label:`Rain ${env.rainfall}mm`, icon:'🌧️', impact:12, cls:'rain' });
  }

  // Traffic impact
  if (env.traffic === 'SEVERE') {
    dropFactor += 0.25; factors.push({ key:'traffic', label:'Traffic: SEVERE', icon:'🚦', impact:25, cls:'traffic' });
  } else if (env.traffic === 'HIGH') {
    dropFactor += 0.10; factors.push({ key:'traffic', label:'Traffic: HIGH', icon:'🚦', impact:10, cls:'traffic' });
  }

  // Heat impact
  if (env.temp > 42) {
    dropFactor += 0.20; factors.push({ key:'heat', label:`Heat ${env.temp}°C`, icon:'🌡️', impact:20, cls:'heat' });
  } else if (env.temp > 38) {
    dropFactor += 0.08; factors.push({ key:'heat', label:`Temp ${env.temp}°C`, icon:'🌡️', impact:8, cls:'heat' });
  }

  dropFactor = Math.min(dropFactor, 0.85); // cap at 85% loss
  const adjusted = Math.round(income * (1 - dropFactor));
  const loss = income - adjusted;

  // Dynamic payout: loss-matched, tiered
  let payout = 0;
  const riskScore = calcRiskScore(env);
  if (riskScore > 80)       payout = Math.max(loss, 700);
  else if (riskScore >= 50) payout = Math.max(loss, 500);
  else if (loss > 0)        payout = Math.max(loss, 300);

  // Round payout to nearest 50
  payout = Math.round(payout / 50) * 50;

  return { income, adjusted, loss, payout, dropFactor, factors, riskScore };
};

const buildIncomeAIText = (policy, env, impact) => {
  const { income, adjusted, loss, dropFactor, factors, riskScore } = impact;
  const factorDescs = factors.map(f => {
    if (f.key === 'aqi') return `AQI (${Math.round(env.aqi)}) forces delivery workers off hazardous air routes`;
    if (f.key === 'rain') return `rainfall (${env.rainfall}mm/hr) reduces outdoor mobility`;
    if (f.key === 'traffic') return `severe traffic congestion extends delivery time by 3×`;
    if (f.key === 'heat') return `extreme heat (${env.temp}°C) limits working hours`;
    return f.label;
  });
  if (factors.length === 0) {
    return `All environmental parameters are within safe limits in ${policy.city}. ${policy.jobType} worker expected to earn full daily income of ₹${income} today. No income disruption detected — payout not triggered.`;
  }
  const pctDrop = Math.round(dropFactor * 100);
  return `Due to ${factorDescs.join(' and ')}, the ${policy.jobType}'s estimated completion rate drops by ${pctDrop}%. Expected daily earnings of ₹${income} are adjusted to ₹${adjusted}, resulting in an income loss of ₹${loss}. Risk score: ${riskScore}/100. Parametric payout of ₹${impact.payout} auto-triggered to compensate disruption.`;
};

const calcRiskTrend = (env) => {
  // Simulate trend: slight random walk from current reading
  const r = (v, spread) => Math.round((v + (Math.random()-0.4)*spread)*10)/10;
  const trafficLevels = ['LOW','MODERATE','HIGH','SEVERE'];
  const tIdx = trafficLevels.indexOf(env.traffic);
  const steps = [
    // 0-30 min: slight variation
    { aqi: r(env.aqi, 20),     rainfall: r(env.rainfall, 8),  temp: r(env.temp, 1),   traffic: trafficLevels[Math.max(0,tIdx+(Math.random()>.6?1:0))] },
    // 30-60 min: escalate
    { aqi: r(env.aqi+25, 20),  rainfall: r(env.rainfall+10, 10), temp: r(env.temp+1.5,1.5), traffic: trafficLevels[Math.min(3,tIdx+(Math.random()>.4?1:0))] },
    // 60-120 min: moderate
    { aqi: r(env.aqi+10, 30),  rainfall: r(env.rainfall+5, 12), temp: r(env.temp+0.5,2),  traffic: trafficLevels[Math.min(3,tIdx)] },
  ];
  return steps.map(s => ({ ...s, risk: calcRiskScore(s) }));
};

    setAiLoading(true);

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514', max_tokens:100,
          messages:[{role:'user',content:`IncomeShield Prevention AI for ${city}. Current: AQI ${Math.round(env.aqi)}, Rain ${env.rainfall}mm, Traffic ${env.traffic}, Temp ${env.temp}°C. Risk trend: ${trendStr}. Predicted income at risk: ₹${preventedLoss}. Write 1 sentence (max 35 words) as an early warning to a gig worker. Start with "High [factor] expected in next 30 mins →". Include a specific suggested action to prevent income loss.`}]
        })
      });
      const d = await res.json();
      setAiAdvice(d.content?.map(b=>b.text||'').join('').trim());
    } catch {
      const factors = [];
      if (env.aqi > 200) factors.push(`AQI ${Math.round(env.aqi)}`);
      if (env.rainfall > 30) factors.push(`rainfall ${env.rainfall}mm`);
      if (env.traffic === 'SEVERE' || env.traffic === 'HIGH') factors.push(`traffic congestion`);
      if (env.temp > 38) factors.push(`heat ${env.temp}°C`);
      const f = factors.length ? factors[0] : `risk score ${nextRisk}%`;
      setAiAdvice(`High ${f} expected in next 30 mins → suggest pausing outdoor work and waiting indoors → prevent estimated ₹${preventedLoss} income loss.`);
    }
    setLastRun(new Date());
    setAiLoading(false);
  };

  // Loss vs Protection comparison data
  const workers = DB.policies.filter(p=>p.status==='ACTIVE' && p.city===city);
  const totalExpected = workers.reduce((s,p)=>s+(parseFloat(p.dailyIncome)||800),0) || 1200;
  const totalLossWithout = workers.length > 0 ? workers.reduce((s,p)=>{ const i=calcIncomeLoss(p,env); return s+i.loss; },0) : preventedLoss;
  const totalPayout = workers.length > 0 ? workers.reduce((s,p)=>{ const i=calcIncomeLoss(p,env); return s+i.payout; },0) : preventedLoss;
  const netImpact = totalLossWithout - totalPayout;

  return (

      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">🔮 Prevention AI</div>

        </div>

      </div>

            <div className="prev-title">

            <div className={`prev-action ${!isWarning?'prev-action-safe':''}`}>
              {isWarning ? '🛑 Suggested: Pause outdoor work for 30 mins' : '✅ Continue working normally'}

            <div style={{fontSize:48,fontWeight:900,color:'#fff',fontFamily:'IBM Plex Mono',lineHeight:1}}>{nextRisk}%</div>

          </div>
        </div>

          <div className="prev-stat">
            <div className="prev-stat-l">Current Risk</div>
            <div className="prev-stat-v" style={{color:currentRisk>70?'#fca5a5':currentRisk>40?'#fcd34d':'#86efac'}}>{currentRisk}%</div>
          </div>
          <div className="prev-stat">
            <div className="prev-stat-l">Prevented Loss</div>
            <div className="prev-stat-v" style={{color:'#86efac'}}>₹{preventedLoss}</div>
          </div>
          <div className="prev-stat">
            <div className="prev-stat-l">Workers at Risk</div>
            <div className="prev-stat-v">{workers.length > 0 ? workers.length : DB.policies.filter(p=>p.status==='ACTIVE').length}</div>
          </div>
        </div>
      </div>

            const step = trend[slot.key];
            const lvl = getRiskLevel(step.risk);
            const pct = step.risk;
            const factors = [];
            if (step.aqi > 300) factors.push(`AQI ${Math.round(step.aqi)}`);
            else if (step.aqi > 200) factors.push(`AQI ${Math.round(step.aqi)}`);
            if (step.rainfall > 50) factors.push(`Rain ${step.rainfall}mm`);
            if (step.traffic === 'SEVERE' || step.traffic === 'HIGH') factors.push(`Traffic: ${step.traffic}`);
            if (step.temp > 40) factors.push(`Heat ${step.temp}°C`);
            return (

          </div>
        </div>

        {/* AI PREVENTION ADVICE */}

              </div>
              <button className="btn btn-sm" style={{marginLeft:'auto',fontSize:11,background:'rgba(255,255,255,0.1)',color:'#c7d2fe',border:'1px solid rgba(255,255,255,0.15)',padding:'5px 12px'}}

              </div>

              <div style={{fontSize:12,color:'rgba(199,210,254,0.5)',fontStyle:'italic'}}>

              </div>

          </div>

          {/* QUICK WORKER ACTIONS */}
          <div className="card card-sm">
            <div className="ct" style={{marginBottom:10}}>🛠️ Suggested Worker Actions</div>
            {[
              { condition: env.aqi > 200,                   icon:'😷', action:'Wear N95 mask or avoid outdoor routes with heavy traffic', priority:'HIGH' },
              { condition: env.rainfall > 30,               icon:'🌧️', action:'Wait for rainfall to reduce — delay delivery by 30–45 mins', priority:'MED' },
              { condition: env.traffic==='SEVERE'||env.traffic==='HIGH', icon:'🚦', action:'Switch to alternate routes or batch orders to reduce travel', priority:'MED' },
              { condition: env.temp > 38,                   icon:'🌡️', action:'Hydrate frequently and avoid peak heat hours (12pm–3pm)', priority:'LOW' },
              { condition: true,                             icon:'📱', action:'Keep IncomeShield AI active — claim auto-triggers if threshold breached', priority:'INFO' },
            ].filter(a=>a.condition).slice(0,3).map((a,i)=>(
              <div key={i} style={{display:'flex',gap:9,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontSize:16,flexShrink:0}}>{a.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:11.5,color:'var(--text2)',lineHeight:1.5}}>{a.action}</div>
                </div>
                <span className={`badge ${a.priority==='HIGH'?'b-re':a.priority==='MED'?'b-am':a.priority==='INFO'?'b-bl':'b-gr'}`} style={{fontSize:9,alignSelf:'flex-start',flexShrink:0}}>{a.priority}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* LOSS vs PROTECTION COMPARISON */}
      <div className="section-divider" style={{margin:'4px 0 16px'}}>
        <div className="section-divider-line"/>
        <div className="section-divider-text">💸 Loss vs Protection — Why IncomeShield Works</div>
        <div className="section-divider-line"/>
      </div>

      <div className="lvp-wrap" style={{marginBottom:20}}>
        <div style={{padding:'12px 16px',background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>
            Scenario: {city} worker · Daily income ₹{workers.length?workers[0]?.dailyIncome:1200} · Current disruptions: {[env.aqi>200&&'AQI',env.rainfall>30&&'Rain',env.traffic!=='LOW'&&env.traffic!=='MODERATE'&&'Traffic',env.temp>38&&'Heat'].filter(Boolean).join(' + ')||'None'}
          </div>
        </div>
        <div className="lvp-row">
          <div className="lvp-cell loss-side">
            <div className="lvp-label">❌ Without IncomeShield</div>
            <div className="lvp-val" style={{color:'var(--red2)'}}>₹{totalLossWithout||preventedLoss}</div>
            <div className="lvp-sub">Income lost due to disruption</div>
            <div style={{marginTop:10,fontSize:11,color:'var(--red2)',fontWeight:600,lineHeight:1.5}}>
              Worker stops earning → no fallback → debt risk → financial stress
            </div>
          </div>
          <div className="lvp-divider">
            <div style={{fontSize:18,color:'var(--text4)',transform:'rotate(90deg)'}}>VS</div>
          </div>
          <div className="lvp-cell prot-side">
            <div className="lvp-label">✅ With IncomeShield AI</div>
            <div className="lvp-val" style={{color:'var(--green2)'}}>₹{totalPayout||preventedLoss} <span style={{fontSize:13,fontWeight:600}}>recovered</span></div>
            <div className="lvp-sub">Auto-payout covers income gap</div>
            <div style={{marginTop:10,fontSize:11,color:'var(--green2)',fontWeight:600,lineHeight:1.5}}>
              Worker operations disrupted → income at risk → system automatically protected earnings
            </div>
          </div>
        </div>
        <div className="lvp-net">
          <div>
            <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,marginBottom:3}}>📊 Net Financial Impact on Worker</div>
            <div style={{fontSize:11,color:'var(--text4)'}}>Loss ₹{totalLossWithout||preventedLoss} − Payout ₹{totalPayout||preventedLoss} = Net ₹{Math.max(0,netImpact)} remaining gap</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:24,fontWeight:900,fontFamily:'IBM Plex Mono',color:netImpact<=0?'var(--green2)':'var(--amber2)',animation:'countUp 0.8s ease both'}}>
              {netImpact<=0?'₹0 loss':'₹'+netImpact+' gap'}
            </div>
            <div style={{fontSize:10,color:netImpact<=0?'var(--green2)':'var(--amber2)',fontWeight:700,marginTop:2}}>
              {netImpact<=0?'✅ Fully Protected':'⚠ Partial coverage'}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};
