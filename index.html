// FRAUD SHIELD — CLEAN 3-GROUP DETECTION
// ══════════════════════════════════════════════════════════
const FraudShield = () => {
  const [groupResults, setGroupResults] = useState({});
  const [running, setRunning] = useState(false);
  const [log, setLog] = useState([]);
  const [scanCity, setScanCity] = useState('Chennai');
  const [expandedGroup, setExpandedGroup] = useState(null);

  // 3 clean groups instead of 6 scattered checks
  const FRAUD_GROUPS = [
    {
      id: 'identity',
      icon: '📍',
      color: '#6366f1',
      bg: 'linear-gradient(135deg,#eef2ff,#f5f3ff)',
      border: 'rgba(99,102,241,0.3)',
      label: 'Identity Check',
      tagline: 'GPS + Device Verification',
      desc: 'Is this really the registered worker, in the right place?',
      checks: [
        { name: 'GPS Location', desc: 'Device GPS matches registered city within 50km radius', method: 'Device GPS API + IP triangulation' },
        { name: 'Device Fingerprint', desc: 'Claim originates from registered device ID', method: 'Device ID hash + session token validation' },
      ],
      flagExample: 'GPS mismatch — worker registered in Chennai but claim triggered from Hyderabad IP',
    },
    {
      id: 'activity',
      icon: '📱',
      color: '#f59e0b',
      bg: 'linear-gradient(135deg,#fffbeb,#fef3c7)',
      border: 'rgba(245,158,11,0.3)',
      label: 'Activity Check',
      tagline: 'Was the Worker Actually Disrupted?',
      desc: 'Did the worker go offline due to real conditions?',
      checks: [
        { name: 'Platform Activity Log', desc: 'Worker was active before disruption and went offline after trigger', method: 'App session logs + delivery platform API' },
        { name: 'Order Completion Rate', desc: 'Delivery count dropped significantly during disruption window', method: 'Cross-check delivery timestamps vs trigger timestamp' },
      ],
      flagExample: 'Activity mismatch — worker shows 8 deliveries completed during "rainfall disruption"',
    },
    {
      id: 'pattern',
      icon: '🕵️',
      color: '#dc2626',
      bg: 'linear-gradient(135deg,#fef2f2,#fff5f5)',
      border: 'rgba(220,38,38,0.3)',
      label: 'Pattern Check',
      tagline: 'Duplicate / Abnormal Claims',
      desc: 'Does this claim look statistically normal?',
      checks: [
        { name: 'Duplicate Claim Block', desc: 'One claim per trigger event per worker per 24 hours', method: 'DB hash: workerID + triggerType + date' },
        { name: 'Frequency Anomaly', desc: 'Claim rate vs city average — flags outliers using ML model', method: 'Statistical z-score on rolling 7-day window' },
        { name: 'Velocity Check', desc: 'Flags claims submitted <45 seconds after trigger (bot signature)', method: 'Trigger-to-claim latency analysis' },
      ],
      flagExample: 'Anomaly — worker claims every rain event (9/9 days), city avg is 4.2/9 · Claim filed 12s after trigger',
    },
  ];

  const runScan = async () => {
    setRunning(true);
    setGroupResults({});
    setLog([]);
    setExpandedGroup(null);
    const results = {};
    for (let i=0; i<FRAUD_GROUPS.length; i++) {
      const group = FRAUD_GROUPS[i];
      setLog(l=>[...l, `[${new Date().toLocaleTimeString('en-IN')}] Checking ${group.label}…`]);
      await new Promise(r=>setTimeout(r, 700+Math.random()*500));
      const fraudProb = Math.random();
      const status = group.id==='identity' ? 'CLEAR' :
                     group.id==='pattern' && DB.claims.length>2 ? (Math.random()<0.4?'FLAGGED':'CLEAR') :
                     fraudProb < 0.78 ? 'CLEAR' : 'FLAGGED';
      const score = status==='CLEAR' ? Math.round(Math.random()*20+3) : Math.round(Math.random()*35+55);
      results[group.id] = { status, score };
      setGroupResults({...results});
      setLog(l=>[...l, `[${new Date().toLocaleTimeString('en-IN')}] ${group.label}: ${status} (risk: ${score}/100)`]);
    }
    setRunning(false);
    const flaggedCount = Object.values(results).filter(r=>r.status==='FLAGGED').length;
    if (flaggedCount > 0) toast.warn(`⚠ ${flaggedCount} fraud group(s) flagged in ${scanCity}`);
    else toast.success('✅ All 3 fraud groups passed — claim verified clean');
  };

  const allDone = FRAUD_GROUPS.every(g=>groupResults[g.id]);
  const flaggedCount = Object.values(groupResults).filter(r=>r.status==='FLAGGED').length;
  const overallScore = allDone ? Math.round(Object.values(groupResults).reduce((s,r)=>s+r.score,0)/FRAUD_GROUPS.length) : 0;

  return (
    <div className="fade-up">
      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">🔐 Fraud Shield</div>
          <div className="ph-sub">3-layer AI detection — understand it in 5 seconds</div>
        </div>
        <div className="ph-right">
          <select className="fsel" style={{width:160,fontSize:12}} value={scanCity} onChange={e=>setScanCity(e.target.value)}>
            {Object.keys(CITY_DATA).slice(0,15).map(c=><option key={c}>{c}</option>)}
          </select>
          <button className="btn btn-pr" onClick={runScan} disabled={running}>
            {running ? <><span className="sp sp-sm"/>Scanning…</> : '🔍 Run Fraud Scan'}
          </button>
        </div>
      </div>

      {/* OVERALL VERDICT */}
      {allDone && (
        <div className="fade-up" style={{
          marginBottom:18,padding:'16px 20px',
          background: flaggedCount===0 ? 'linear-gradient(135deg,#052e16,#14532d)' : 'linear-gradient(135deg,#450a0a,#7f1d1d)',
          borderRadius:14,border: `2px solid ${flaggedCount===0?'rgba(34,197,94,0.4)':'rgba(239,68,68,0.4)'}`,
          display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,flexWrap:'wrap'
        }}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontSize:30}}>{flaggedCount===0?'✅':'⚠️'}</div>
            <div>
              <div style={{fontSize:16,fontWeight:900,color:'#fff'}}>{flaggedCount===0?'CLAIM VERIFIED CLEAN':'FRAUD SIGNALS DETECTED'}</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginTop:2}}>{flaggedCount} of 3 groups flagged · Overall risk score: {overallScore}/100</div>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:38,fontWeight:900,fontFamily:"'IBM Plex Mono',monospace",color:overallScore<30?'#34d399':overallScore<60?'#fbbf24':'#f87171',lineHeight:1}}>{overallScore}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,0.4)',marginTop:2}}>/100 fraud risk</div>
          </div>
        </div>
      )}

      {/* 3 GROUP CARDS */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:18}}>
        {FRAUD_GROUPS.map((group)=>{
          const result = groupResults[group.id];
          const isRunning = running && !result;
          const expanded = expandedGroup === group.id;
          return (
            <div key={group.id}
              onClick={()=>result&&setExpandedGroup(expanded?null:group.id)}
              style={{
                background: result ? group.bg : 'var(--card)',
                border:`2px solid ${result?(result.status==='FLAGGED'?group.border.replace('0.3','0.8'):group.border):isRunning?group.border:'var(--border)'}`,
                borderRadius:16,padding:20,cursor:result?'pointer':'default',
                transition:'all 0.3s cubic-bezier(0.34,1.56,0.64,1)',
                opacity: isRunning ? 0.75 : 1,
                position:'relative',overflow:'hidden'
              }}>
              {/* Top accent line */}
              {result && <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:group.color,borderRadius:'16px 16px 0 0'}}/>}
              {/* Running shimmer */}
              {isRunning && <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,transparent,${group.color},transparent)`,animation:'shimmer 1.4s infinite',backgroundSize:'400px 100%'}}/>}

              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:14}}>
                <div style={{
                  width:44,height:44,borderRadius:12,flexShrink:0,
                  background: result ? group.color+'20' : 'var(--bg3)',
                  border:`1.5px solid ${result ? group.color+'40' : 'var(--border)'}`,
                  display:'flex',alignItems:'center',justifyContent:'center',fontSize:20
                }}>
                  {isRunning ? <span className="sp sp-sm" style={{borderTopColor:group.color}}/> : group.icon}
                </div>
                {result && (
                  <span style={{
                    fontSize:10,fontWeight:800,padding:'3px 10px',borderRadius:99,letterSpacing:0.5,
                    background: result.status==='CLEAR' ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)',
                    color: result.status==='CLEAR' ? '#16a34a' : '#dc2626',
                    border: `1px solid ${result.status==='CLEAR'?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'}`,
                  }}>{result.status==='CLEAR'?'✓ CLEAR':'⚠ FLAGGED'}</span>
                )}
              </div>

              <div style={{fontWeight:800,fontSize:15,color:'var(--text)',marginBottom:3,lineHeight:1.2}}>{group.label}</div>
              <div style={{fontSize:11,fontWeight:700,color:group.color,marginBottom:6}}>{group.tagline}</div>
              <div style={{fontSize:11.5,color:'var(--text3)',lineHeight:1.55,marginBottom:12}}>{group.desc}</div>

              {/* Sub-checks as pills */}
              <div style={{display:'flex',flexDirection:'column',gap:5}}>
                {group.checks.map((c,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 8px',background:'rgba(0,0,0,0.04)',borderRadius:7,fontSize:11}}>
                    <span style={{color:result?.status==='CLEAR'?'#16a34a':result?.status==='FLAGGED'?'#dc2626':'var(--text4)',fontWeight:800,flexShrink:0}}>
                      {result?.status==='CLEAR'?'✓':result?.status==='FLAGGED'?'⚠':'○'}
                    </span>
                    <span style={{color:'var(--text2)',fontWeight:500}}>{c.name}</span>
                  </div>
                ))}
              </div>

              {/* Risk score if done */}
              {result && (
                <div style={{marginTop:12,paddingTop:10,borderTop:'1px solid rgba(0,0,0,0.07)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:10,color:'var(--text4)',fontWeight:600}}>Risk score</span>
                  <span style={{fontWeight:900,fontFamily:"'IBM Plex Mono',monospace",fontSize:15,color:result.score>50?'var(--red2)':result.score>30?'var(--amber2)':'var(--green2)'}}>{result.score}/100</span>
                </div>
              )}

              {/* Expanded detail */}
              {expanded && result && (
                <div className="fade-in" style={{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(0,0,0,0.07)'}}>
                  {result.status==='FLAGGED' && (
                    <div style={{padding:'9px 12px',background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.2)',borderRadius:8,fontSize:11,color:'var(--red2)',fontWeight:600,marginBottom:8,lineHeight:1.6}}>
                      ⚠ {group.flagExample}
                    </div>
                  )}
                  {group.checks.map((c,i)=>(
                    <div key={i} style={{padding:'6px 0',borderBottom:'1px dashed rgba(0,0,0,0.07)'}}>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:2}}>{c.name}</div>
                      <div style={{fontSize:10.5,color:'var(--text3)',marginBottom:1}}>{c.desc}</div>
                      <div style={{fontSize:10,color:'var(--text4)'}}>Method: {c.method}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="g12">
        {/* SCAN LOG */}
        <div className="card card-sm">
          <div className="ct">🖥️ Scan Log</div>
          {log.length===0 ? (
            <div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'20px 0'}}>Run a scan to see real-time logs</div>
          ) : (
            <div style={{maxHeight:220,overflowY:'auto'}}>
              {log.map((l,i)=>(
                <div key={i} className="log-entry">
                  <span className="log-msg" style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10.5,color:l.includes('FLAGGED')?'var(--amber2)':l.includes('CLEAR')?'var(--green2)':'var(--text3)'}}>{l}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* PLATFORM FRAUD STATS */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div className="card card-sm">
            <div className="ct">🛡️ Platform Fraud Stats</div>
            {[
              ['Claims Scanned', DB.claims.length||'—'],
              ['Fraud Blocked', `${DB.claims.filter(c=>c.fraudCheck==='FLAGGED').length}`],
              ['Block Rate', DB.claims.length?`${Math.round(DB.claims.filter(c=>c.fraudCheck==='FLAGGED').length/DB.claims.length*100)}%`:'—'],
              ['Savings', `₹${DB.claims.filter(c=>c.fraudCheck==='FLAGGED').reduce((s,c)=>s+c.amount,0)||0}`],
            ].map(([k,v])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>
                <span style={{color:'var(--text3)'}}>{k}</span>
                <span style={{fontWeight:700,color:'var(--text)',fontFamily:"'IBM Plex Mono',monospace"}}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{padding:'14px 16px',background:'linear-gradient(135deg,#0f172a,#1e1b4b)',borderRadius:12,border:'1px solid rgba(99,102,241,0.3)'}}>
            <div style={{fontSize:10,color:'rgba(199,210,254,0.5)',letterSpacing:1,textTransform:'uppercase',fontWeight:700,marginBottom:10}}>Why 3 Groups?</div>
            {['Identity — WHO is claiming?','Activity — WERE they disrupted?','Pattern — Does it look NORMAL?'].map((t,i)=>(
              <div key={i} style={{display:'flex',gap:8,padding:'5px 0',fontSize:11.5,color:'rgba(255,255,255,0.7)',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
                <span style={{color:'#818cf8',fontWeight:800,flexShrink:0}}>{i+1}.</span><span>{t}</span>
              </div>
            ))}
            <div style={{marginTop:10,fontSize:11,color:'rgba(199,210,254,0.45)',fontStyle:'italic',lineHeight:1.6}}>
              "A real fraud has to pass all 3 layers — making false claims computationally expensive."
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// SMART PREMIUM ADJUSTMENT — ★ DIFFERENTIATOR FEATURE ★
// ══════════════════════════════════════════════════════════
const SmartPremiumAdjustment = () => {
  const [selectedCity, setSelectedCity] = useState('Mumbai');
  const [selectedJob, setSelectedJob] = useState('Driver');
  const [weekData, setWeekData] = useState(null);
  const [cityComparison, setCityComparison] = useState([]);
  const [animKey, setAnimKey] = useState(0);

  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const DAY_ICONS = {
    safe: ['☀️','🌤️','✅'],
    moderate: ['🌥️','🌦️','⚠️'],
    risky: ['🌧️','😷','🚦','🌡️']
  };

  const generateWeekData = (city, jobType) => {
    const cd = CITY_DATA[city] || CITY_DATA['Mumbai'];
    const base = calcPremium(city, jobType, 600, null);
    return DAYS.map((day, i) => {
      // Simulate weekly variation: weekends slightly lower, mid-week varies
      const dayVariance = [0.85, 1.0, 1.1, 0.95, 1.05, 0.75, 0.70][i];
      const envRand = 0.7 + Math.random() * 0.6;
      const fakeEnv = {
        rainfall: cd.rainBase * envRand,
        aqi: cd.aqiBase * envRand,
        temp: cd.tempBase,
        traffic: ['LOW','MODERATE','HIGH','SEVERE'][Math.floor(Math.random() * 4)]
      };
      const pd = calcPremium(city, jobType, 600, fakeEnv);
      const adj = Math.round(pd.premium * dayVariance);
      const level = adj <= base.premium * 0.85 ? 'safe' : adj >= base.premium * 1.1 ? 'risky' : 'moderate';
      const icons = DAY_ICONS[level];
      return {
        day, adj, base: base.premium,
        delta: adj - base.premium,
        level,
        icon: icons[Math.floor(Math.random() * icons.length)],
        env: fakeEnv
      };
    });
  };

  const generateCityComparison = (jobType) => {
    const cities = ['Mumbai','Delhi','Bengaluru','Pune','Chennai','Kolkata','Jaipur','Mysuru'];
    return cities.map(city => {
      const cd = CITY_DATA[city];
      const base = calcPremium(city, jobType, 600, null);
      // Low-risk week = 20% discount
      const lowWeekPremium = Math.round(base.premium * 0.80);
      const adj = base.premium - lowWeekPremium;
      return { city, base: base.premium, lowWeekPremium, saving: adj, risk: cd.risk };
    }).sort((a,b) => b.base - a.base);
  };

  useEffect(() => {
    setWeekData(generateWeekData(selectedCity, selectedJob));
    setCityComparison(generateCityComparison(selectedJob));
    setAnimKey(k => k+1);
  }, [selectedCity, selectedJob]);

  const totalWeekPremium = weekData ? weekData.reduce((s,d)=>s+d.adj,0) : 0;
  const baseWeekPremium = weekData ? weekData[0]?.base * 7 : 0;
  const weekSaving = baseWeekPremium - totalWeekPremium;
  const weekRiskDays = weekData ? weekData.filter(d=>d.level==='risky').length : 0;
  const weekSafeDays = weekData ? weekData.filter(d=>d.level==='safe').length : 0;

  return (
    <div className="fade-up">
      {/* PAGE HEADER */}
      <div className="ph">
        <div className="ph-left">
          <div className="ph-title">🎛️ Smart Premium Adjustment</div>
          <div className="ph-sub">
            <span style={{color:'var(--teal)',fontWeight:700}}>★ Differentiator Feature</span>
            <span style={{color:'var(--text4)',margin:'0 6px'}}>·</span>
            Premiums auto-adjust: ↓ low-risk weeks · ↑ high-risk cities
          </div>
        </div>
        <div className="ph-right">
          <select className="fsel" style={{fontSize:12,padding:'7px 10px',width:130}} value={selectedCity} onChange={e=>setSelectedCity(e.target.value)}>
            {Object.keys(CITY_DATA).filter(c=>['Mumbai','Delhi','Bengaluru','Pune','Chennai','Kolkata','Jaipur','Mysuru','Hyderabad','Coimbatore'].includes(c)).map(c=>(
              <option key={c}>{c}</option>
            ))}
          </select>
          <select className="fsel" style={{fontSize:12,padding:'7px 10px',width:120}} value={selectedJob} onChange={e=>setSelectedJob(e.target.value)}>
            <option>Driver</option><option>Delivery</option><option>Freelancer</option>
          </select>
        </div>
      </div>

      {/* HERO BANNER */}
      <div className="spa-hero">
        <div className="spa-label">✦ AI-Powered Fairness Engine</div>
        <div className="spa-title">Your premium moves with your risk — not against you</div>
        <div className="spa-sub">Low-risk week in a safe city? Premium drops automatically. High-risk city? Premium reflects real exposure. No flat rates. No surprises.</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>
          <div className="spa-chip">📉 Low-risk week → premium ↓ up to 25%</div>
          <div className="spa-chip">📈 High-risk city → premium ↑ to match exposure</div>
          <div className="spa-chip">⚡ Recalculated daily · auto-adjusted</div>
        </div>
      </div>

      {/* HOW IT WORKS — TWO CARDS */}
      <div className="spa-grid">
        {/* LOW RISK WEEK */}
        <div className="spa-card low-risk" style={{animation:`savingGlow 3s ease-in-out infinite`}}>
          <div className="spa-card-label">🟢 Scenario A — Safe Week</div>
          <div className="spa-card-title">Low environmental risk this week → Worker earns reward</div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
            <div className="spa-arrow">📉</div>
            <div>
              <div className="spa-delta down">↓ −20% premium</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:5}}>When: AQI &lt; 150, Rainfall &lt; 30mm, Traffic LOW for 5+ days</div>
            </div>
          </div>
          <div className="spa-meter">
            <div className="spa-meter-label"><span>Week Risk Level</span><span style={{color:'var(--teal2)'}}>LOW</span></div>
            <div className="spa-meter-track"><div className="spa-meter-fill safe" style={{width:'28%'}}/></div>
          </div>
          <div style={{marginTop:12,padding:'9px 12px',background:'rgba(13,148,136,0.08)',border:'1px solid rgba(13,148,136,0.2)',borderRadius:8,fontSize:11,color:'var(--teal2)',fontWeight:600}}>
            💡 Worker saves ₹15–₹25 this week — AI verified 5 consecutive safe days
          </div>
        </div>

        {/* HIGH RISK CITY */}
        <div className="spa-card high-risk" style={{animation:`riskGlow 3s ease-in-out infinite`}}>
          <div className="spa-card-label">🟡 Scenario B — High-Risk City</div>
          <div className="spa-card-title">High-pollution, high-traffic city → Premium reflects real exposure</div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
            <div className="spa-arrow">📈</div>
            <div>
              <div className="spa-delta up">↑ +30–50% premium</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:5}}>When: City risk = HIGH · AQI &gt; 250 · Traffic SEVERE zones</div>
            </div>
          </div>
          <div className="spa-meter">
            <div className="spa-meter-label"><span>Week Risk Level</span><span style={{color:'var(--amber2)'}}>HIGH</span></div>
            <div className="spa-meter-track"><div className="spa-meter-fill risky" style={{width:'78%'}}/></div>
          </div>
          <div style={{marginTop:12,padding:'9px 12px',background:'rgba(217,119,6,0.08)',border:'1px solid rgba(217,119,6,0.2)',borderRadius:8,fontSize:11,color:'var(--amber2)',fontWeight:600}}>
            ⚡ City risk factor applied: Delhi (HIGH) = 3× base city multiplier → higher coverage activated
          </div>
        </div>
      </div>

      {/* WEEKLY PREMIUM CALENDAR */}
      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div className="ct" style={{margin:0}}>📅 7-Day Dynamic Premium Calendar · {selectedCity} · {selectedJob}</div>
          <div style={{display:'flex',gap:8}}>
            <span style={{fontSize:11,color:'var(--teal2)',fontWeight:700,background:'var(--teal-mid)',padding:'3px 9px',borderRadius:99}}>{weekSafeDays} safe days</span>
            <span style={{fontSize:11,color:'var(--amber2)',fontWeight:700,background:'var(--amber-mid)',padding:'3px 9px',borderRadius:99}}>{weekRiskDays} risky days</span>
          </div>
        </div>

        {weekData && (
          <>
            <div className="spa-week-grid" key={animKey}>
              {weekData.map((d,i) => (
                <div key={d.day} className={`spa-day ${d.level}`} style={{animationDelay:`${i*0.06}s`,animation:'smartPremiumIn 0.4s ease both'}}>
                  <div className="spa-day-name">{d.day}</div>
                  <div className="spa-day-icon">{d.icon}</div>
                  <div className={`spa-day-premium ${d.level}`}>₹{d.adj}</div>
                  <div className="spa-day-label">{d.delta > 0 ? `+₹${d.delta}` : d.delta < 0 ? `−₹${Math.abs(d.delta)}` : 'Base'}</div>
                </div>
              ))}
            </div>

            {/* Week summary strip */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:0,background:'var(--bg3)',borderRadius:10,overflow:'hidden',border:'1px solid var(--border)'}}>
              {[
                {label:'Total This Week', val:`₹${totalWeekPremium}`, color:'var(--text)', sub:'actual adjusted'},
                {label:'Flat Rate (no adjust)', val:`₹${baseWeekPremium}`, color:'var(--text3)', sub:'without Smart Premium'},
                {label:'Smart Saving', val: weekSaving >= 0 ? `₹${weekSaving}` : `−₹${Math.abs(weekSaving)}`, color: weekSaving >= 0 ? 'var(--teal2)' : 'var(--amber2)', sub: weekSaving >= 0 ? 'worker saves this week' : 'extra protection cost'},
                {label:'Avg/Day', val:`₹${Math.round(totalWeekPremium/7)}`, color:'var(--blue)', sub:'dynamically adjusted'},
              ].map(({label,val,color,sub},i)=>(
                <div key={label} style={{padding:'12px 14px',textAlign:'center',borderRight:i<3?'1px solid var(--border)':'none'}}>
                  <div style={{fontSize:9.5,textTransform:'uppercase',letterSpacing:0.8,color:'var(--text4)',fontWeight:700,marginBottom:4}}>{label}</div>
                  <div style={{fontSize:20,fontWeight:900,color,fontFamily:'IBM Plex Mono',lineHeight:1}}>{val}</div>
                  <div style={{fontSize:10,color:'var(--text4)',marginTop:3}}>{sub}</div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>

      {/* CITY RISK TABLE */}
      <div className="card" style={{marginBottom:20}}>
        <div className="ct">🗺️ City Risk → Premium Impact Comparison · {selectedJob} Worker</div>
        <div className="spa-city-table">
          <div className="spa-ct-header">
            <div className="spa-ct-hcell">City</div>
            <div className="spa-ct-hcell">Risk Level</div>
            <div className="spa-ct-hcell">Base Premium</div>
            <div className="spa-ct-hcell">Safe-Week Rate</div>
            <div className="spa-ct-hcell">Adjustment</div>
          </div>
          {cityComparison.map((row, i) => {
            const riskBadge = row.risk==='HIGH'?'b-re':row.risk==='MEDIUM'?'b-am':'b-gr';
            const adjLabel = row.saving > 0 ? `−₹${row.saving}/wk` : `+₹${Math.abs(row.saving)}/wk`;
            const adjCls = row.saving > 0 ? 'down' : row.saving < 0 ? 'up' : 'flat';
            return (
              <div key={row.city} className="spa-ct-row" style={{animationDelay:`${i*0.04}s`}}>
                <div className="spa-ct-city">{row.city}</div>
                <div><span className={`badge ${riskBadge}`} style={{fontSize:10}}>{row.risk==='HIGH'?'🔴':row.risk==='MEDIUM'?'🟡':'🟢'} {row.risk}</span></div>
                <div className="spa-ct-val" style={{color:'var(--text2)'}}>₹{row.base}/wk</div>
                <div className="spa-ct-val" style={{color:'var(--teal2)'}}>₹{row.lowWeekPremium}/wk</div>
                <div><span className={`spa-adj-pill ${adjCls}`}>{row.saving >= 0 ? '↓' : '↑'} {adjLabel}</span></div>
              </div>
            );
          })}
        </div>
      </div>

      {/* AI INSIGHT BOX */}
      <div className="spa-insight-box">
        <div className="spa-insight-title">✦ Smart Premium AI Logic</div>
        <div className="spa-insight-text">
          The engine scores each day on 4 dimensions: <strong style={{color:'#99f6e4'}}>AQI, Rainfall, Temperature,</strong> and <strong style={{color:'#99f6e4'}}>Traffic severity</strong>. 
          A weekly risk index is computed and compared to city baseline. If 5+ consecutive days fall below city baseline risk, 
          a <strong style={{color:'#5eead4'}}>−15% to −25% loyalty discount</strong> is applied automatically. Conversely, if city-level risk is HIGH (AQI &gt; 250, mult &gt; 2.0), 
          premium is lifted to ensure adequate payout reserves. <strong style={{color:'#99f6e4'}}>No claims? Lower week? You pay less. Period.</strong>
        </div>
        <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>
          {[['Daily Risk Score','0–100 index'],['City Multiplier','1.0× – 3.0×'],['Safe Streak Bonus','5+ days → −20%'],['Auto-Adjust','Daily at 6 AM IST'],['Coverage Intact','₹500/trigger'],['Fairness Index','Gini-corrected']].map(([k,v])=>(
            <div key={k} style={{padding:'5px 11px',background:'rgba(255,255,255,0.08)',border:'1px solid rgba(20,184,166,0.25)',borderRadius:8,fontSize:11}}>
              <span style={{color:'rgba(153,246,228,0.6)',fontWeight:600}}>{k}: </span>
              <span style={{color:'rgba(255,255,255,0.85)',fontWeight:700}}>{v}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════
const App = () => {
  const [page, setPage] = useState('dashboard');
  const [user, setUser] = useState(() => DB.users[DB.users.length-1] || null);
  const [pipeline, setPipeline] = useState(null);
  const pipeRef = useRef(null);

  useEffect(() => subscribe(() => {
    if (!user && DB.users.length > 0) setUser(DB.users[DB.users.length-1]);
  }), [user]);

  const nav = (p) => {
    if (p !== 'pipeline') pipeRef.current = null;
    setPage(p);
  };

  const startPipeline = (data) => {
    pipeRef.current = data;
    setPipeline({ ...data, _ts: Date.now() });
    setPage('pipeline');
  };

  const pages = {
    dashboard:   <Dashboard setPage={nav}/>,
    persona:     <PersonaPage setPage={nav}/>,
    register:    <Register setUser={u=>{ setUser(u); }} setPage={nav}/>,
    policy:      <PolicyCenter user={user} setPage={nav}/>,
    smartpremium:<SmartPremiumAdjustment/>,
    triggers:    <Triggers setPage={nav} setPipeline={startPipeline}/>,
    prevention:  <PreventionAI/>,
    pipeline:    <Pipeline pipeline={pipeline} setPipeline={setPipeline}/>,
    claims:      <ClaimsCenter/>,
    fraud:       <FraudShield/>,
    analytics:   <Analytics/>,
    ledger:      <Ledger/>,
    datasources: <DataSources/>,
    incomeimpact:<WorkerIncomeImpactAI/>,
  };

  return (
    <>
      <Toasts/>
      <div className="shell">
        <Sidebar page={page} setPage={nav} user={user}/>
        <main className="main">{pages[page]}</main>
      </div>
    </>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
